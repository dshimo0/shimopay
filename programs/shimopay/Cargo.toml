[package]
name = "shimopay-solana"
version = "0.2.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "lib"]
name = "shimopay_solana"
[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["token", "associated_token"] }
solana-program = "2.3.0"
